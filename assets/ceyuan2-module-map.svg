<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">Ceyuan2 reference module map</title>
  <desc id="desc">A module map showing Ceyuan2 references grouped by triage, evidence, behavior, business model, narrative, creative, delivery, red team, and proposal output.</desc>
  <defs>
    <style>
      .bg{fill:#f8fafc}.ink{fill:#102033;font-family:Arial,"Microsoft YaHei",sans-serif}.muted{fill:#526173;font-family:Arial,"Microsoft YaHei",sans-serif}
      .panel{fill:#fff;stroke:#cbd5e1;stroke-width:2}.head{fill:#0f766e}.red{fill:#b91c1c}.blue{fill:#1d4ed8}.gold{fill:#b45309}.green{fill:#15803d}
      .small{font-size:17px}.mid{font-size:22px;font-weight:700}.big{font-size:36px;font-weight:800}
    </style>
  </defs>
  <rect class="bg" width="1400" height="900"/>
  <text x="46" y="58" class="ink big">策元2模块地图 / Reference Module Map</text>
  <text x="48" y="94" class="muted small">34 个 reference 不是让用户全读；它们按 Step 触发，像专家工具箱一样被按需加载。</text>
  <rect x="40" y="124" width="410" height="185" rx="18" class="panel"/><rect x="40" y="124" width="410" height="48" rx="18" class="head"/><text x="62" y="155" fill="#fff" class="mid">Step 0-1：判局与证据</text><text x="66" y="205" class="ink small">triage-router.md</text><text x="66" y="234" class="ink small">search-paths.md</text><text x="66" y="263" class="ink small">anti-hallucination-and-evidence.md</text><text x="66" y="292" class="muted small">输出：分流判断、来源绑定、证据等级</text>
  <rect x="495" y="124" width="410" height="185" rx="18" class="panel"/><rect x="495" y="124" width="410" height="48" rx="18" class="blue"/><text x="517" y="155" fill="#fff" class="mid">Step 2：行为改变</text><text x="521" y="205" class="ink small">stakeholder-behavior-change.md</text><text x="521" y="234" class="ink small">dimensions.md / axes.md</text><text x="521" y="263" class="ink small">client-vendor-perspectives.md</text><text x="521" y="292" class="muted small">输出：角色、当前行为、目标行为、阻力</text>
  <rect x="950" y="124" width="410" height="185" rx="18" class="panel"/><rect x="950" y="124" width="410" height="48" rx="18" class="gold"/><text x="972" y="155" fill="#fff" class="mid">Step 3：经营模型</text><text x="976" y="205" class="ink small">business-model-and-budget.md</text><text x="976" y="234" class="ink small">metrics-flow.md / data-capture-and-review.md</text><text x="976" y="263" class="ink small">market-track-cards.md / b2b-sales-event-chain.md</text><text x="976" y="292" class="muted small">输出：成本、回报、数据、降级模型</text>
  <rect x="40" y="350" width="410" height="185" rx="18" class="panel"/><rect x="40" y="350" width="410" height="48" rx="18" class="green"/><text x="62" y="381" fill="#fff" class="mid">Step 4：叙事主线</text><text x="66" y="431" class="ink small">china-market-narrative.md</text><text x="66" y="460" class="ink small">pitch-winning-proposal.md</text><text x="66" y="489" class="ink small">culture-tourism-strong-narrative.md</text><text x="66" y="518" class="muted small">输出：主叙事、冲突、情绪曲线、主场面</text>
  <rect x="495" y="350" width="410" height="185" rx="18" class="panel"/><rect x="495" y="350" width="410" height="48" rx="18" class="head"/><text x="517" y="381" fill="#fff" class="mid">Step 5：创意机制</text><text x="521" y="431" class="ink small">creative-inputs.md</text><text x="521" y="460" class="ink small">anti-stale-creative.md / new-media-campaign.md</text><text x="521" y="489" class="ink small">ab-test-routing.md / experiment-validation.md</text><text x="521" y="518" class="muted small">输出：创意闪卡、预检、数据采集点</text>
  <rect x="950" y="350" width="410" height="185" rx="18" class="panel"/><rect x="950" y="350" width="410" height="48" rx="18" class="blue"/><text x="972" y="381" fill="#fff" class="mid">Step 6：交付系统</text><text x="976" y="431" class="ink small">critical-path-delivery.md / registration-and-attendance.md</text><text x="976" y="460" class="ink small">sponsorship-fulfillment.md / session-meeting-design.md</text><text x="976" y="489" class="ink small">scope-and-commercial-boundary.md</text><text x="976" y="518" class="muted small">输出：关键路径、RACI、履约、报名、销售承接</text>
  <rect x="40" y="576" width="410" height="185" rx="18" class="panel"/><rect x="40" y="576" width="410" height="48" rx="18" class="red"/><text x="62" y="607" fill="#fff" class="mid">Step 7：Red Team</text><text x="66" y="657" class="ink small">adversarial.md</text><text x="66" y="686" class="ink small">aesthetic-identity-risk.md</text><text x="66" y="715" class="ink small">anti-hallucination-and-evidence.md</text><text x="66" y="744" class="muted small">输出：策略风险、交付矛盾、修法、降级版</text>
  <rect x="495" y="576" width="410" height="185" rx="18" class="panel"/><rect x="495" y="576" width="410" height="48" rx="18" class="gold"/><text x="517" y="607" fill="#fff" class="mid">Step 8-9：成案与终审</text><text x="521" y="657" class="ink small">proposal-schema.md / boardroom-proposal-schema.md</text><text x="521" y="686" class="ink small">pitch-battle.md / pitch-winning-proposal.md</text><text x="521" y="715" class="ink small">ai-role-prompts.md</text><text x="521" y="744" class="muted small">输出：事实与假设清单、上交版、终审判词</text>
  <rect x="950" y="576" width="410" height="185" rx="18" class="panel"/><rect x="950" y="576" width="410" height="48" rx="18" class="green"/><text x="972" y="607" fill="#fff" class="mid">全流程增强</text><text x="976" y="657" class="ink small">skill-routing.md / event-types.md / industries.md</text><text x="976" y="686" class="ink small">ai-role-prompts.md</text><text x="976" y="715" class="ink small">output/case-library/（复盘写入边界）</text><text x="976" y="744" class="muted small">原则：reference 是方法库，不是每次全量灌入</text>
  <rect x="80" y="798" width="1240" height="56" rx="14" fill="#fff7ed" stroke="#fdba74" stroke-width="2"/>
  <text x="108" y="833" class="gold mid">硬边界：未到 Step 8，不输出完整预算表、完整传播矩阵、完整执行排期或上交版方案结构。</text>
</svg>
