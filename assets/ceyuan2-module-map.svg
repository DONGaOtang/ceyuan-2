<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">策元2 reference 模块地图</title>
  <desc id="desc">用黄黑海报式视觉展示策元2 34 个 reference 模块按流程触发，不需要用户全部阅读。</desc>
  <defs>
    <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".82" numOctaves="3"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="table" tableValues="0 .13"/></feComponentTransfer></filter>
    <pattern id="slash" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M-8 36L36-8M8 44L44 8" stroke="#111827" stroke-opacity=".08" stroke-width="4"/></pattern>
    <style>
      .bg{fill:#e9ede6}.ink{fill:#111827;font-family:Arial,"Microsoft YaHei",sans-serif}.muted{fill:#374151;font-family:Arial,"Microsoft YaHei",sans-serif}
      .yellow{fill:#ffe600}.black{fill:#111827}.white{fill:#fffdf0}.stroke{stroke:#111827;stroke-width:4}.heavy{stroke:#111827;stroke-width:7}
      .big{font-size:58px;font-weight:900}.h2{font-size:28px;font-weight:900}.body{font-size:17px}.small{font-size:14px}
    </style>
  </defs>
  <rect width="1400" height="900" class="bg"/><rect width="1400" height="900" fill="url(#slash)"/><rect width="1400" height="900" filter="url(#grain)"/><rect x="28" y="28" width="1344" height="844" fill="none" class="heavy"/>
  <text x="58" y="84" class="ink small" font-weight="900">REFERENCE MODULE MAP / 34 FILES</text>
  <text x="58" y="154" class="ink big">34 个模块不是让你全读</text>
  <rect x="58" y="174" width="760" height="18" class="yellow"/>
  <text x="58" y="226" class="muted body">它们像专家工具箱：策元2按 Step 和场景触发，只加载当前决策需要的那几组。</text>

  <g transform="translate(58 280)">
    <rect x="0" y="0" width="300" height="150" rx="18" class="yellow stroke"/><text x="22" y="42" class="ink h2">判局与证据</text><text x="24" y="78" class="ink body">triage-router</text><text x="24" y="106" class="ink body">search-paths</text><text x="24" y="134" class="muted small">anti-hallucination</text>
    <rect x="330" y="0" width="300" height="150" rx="18" class="white stroke"/><text x="352" y="42" class="ink h2">行为改变</text><text x="354" y="78" class="ink body">stakeholder-behavior</text><text x="354" y="106" class="ink body">dimensions / axes</text><text x="354" y="134" class="muted small">client-vendor</text>
    <rect x="660" y="0" width="300" height="150" rx="18" class="yellow stroke"/><text x="682" y="42" class="ink h2">经营模型</text><text x="684" y="78" class="ink body">business-model</text><text x="684" y="106" class="ink body">metrics-flow</text><text x="684" y="134" class="muted small">data-capture / To B chain</text>
    <rect x="990" y="0" width="300" height="150" rx="18" class="black"/><text x="1012" y="42" fill="#ffe600" class="h2" font-family="Arial,'Microsoft YaHei',sans-serif">叙事主线</text><text x="1014" y="78" fill="#fffdf0" class="body" font-family="Arial,'Microsoft YaHei',sans-serif">china-market-narrative</text><text x="1014" y="106" fill="#fffdf0" class="body" font-family="Arial,'Microsoft YaHei',sans-serif">pitch-winning</text><text x="1014" y="134" fill="#ffe600" class="small" font-family="Arial,'Microsoft YaHei',sans-serif">culture-tourism</text>

    <rect x="0" y="190" width="300" height="150" rx="18" class="white stroke"/><text x="22" y="232" class="ink h2">创意机制</text><text x="24" y="268" class="ink body">creative-inputs</text><text x="24" y="296" class="ink body">anti-stale-creative</text><text x="24" y="324" class="muted small">new-media / experiment</text>
    <rect x="330" y="190" width="300" height="150" rx="18" class="yellow stroke"/><text x="352" y="232" class="ink h2">交付系统</text><text x="354" y="268" class="ink body">critical-path</text><text x="354" y="296" class="ink body">registration / sponsorship</text><text x="354" y="324" class="muted small">session / scope boundary</text>
    <rect x="660" y="190" width="300" height="150" rx="18" class="black"/><text x="682" y="232" fill="#ffe600" class="h2" font-family="Arial,'Microsoft YaHei',sans-serif">对抗审查</text><text x="684" y="268" fill="#fffdf0" class="body" font-family="Arial,'Microsoft YaHei',sans-serif">adversarial</text><text x="684" y="296" fill="#fffdf0" class="body" font-family="Arial,'Microsoft YaHei',sans-serif">aesthetic-identity-risk</text><text x="684" y="324" fill="#ffe600" class="small" font-family="Arial,'Microsoft YaHei',sans-serif">风险必须给修法</text>
    <rect x="990" y="190" width="300" height="150" rx="18" class="white stroke"/><text x="1012" y="232" class="ink h2">成案与终审</text><text x="1014" y="268" class="ink body">proposal-schema</text><text x="1014" y="296" class="ink body">boardroom-proposal</text><text x="1014" y="324" class="muted small">pitch-battle / role prompts</text>

    <rect x="0" y="386" width="630" height="92" rx="18" class="yellow stroke"/><text x="26" y="425" class="ink h2">行业与场景快速通道</text><text x="28" y="458" class="ink body">event-types / industries / market-track-cards / skill-routing</text>
    <rect x="660" y="386" width="630" height="92" rx="18" class="white stroke"/><text x="686" y="425" class="ink h2">写入边界</text><text x="688" y="458" class="ink body">活动复盘写到独立 case-library，不直接改 reference 方法论</text>
  </g>

  <rect x="82" y="808" width="1236" height="44" rx="22" class="black"/>
  <text x="110" y="837" fill="#ffe600" class="body" font-family="Arial,'Microsoft YaHei',sans-serif" font-weight="900">硬边界：未到 Step 8，不输出完整预算表、传播矩阵、执行排期或上交版方案。</text>
</svg>
