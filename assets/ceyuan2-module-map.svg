<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">策元2 reference 模块地图</title><desc id="desc">34 个 reference 模块按工作阶段触发，不需要用户全部阅读。</desc>
  <defs><filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".72" numOctaves="3"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="table" tableValues="0 .1"/></feComponentTransfer></filter><pattern id="dots" width="14" height="14" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#101010" opacity=".14"/></pattern><style>.ink{fill:#101010;font-family:Arial,"Microsoft YaHei",sans-serif}.cream{fill:#f5f1e7}.yellow{fill:#ffd400}.red{fill:#ef3d2f}.line{stroke:#101010;stroke-width:5}.big{font-size:68px;font-weight:900}.h{font-size:25px;font-weight:900}.body{font-size:17px}.small{font-size:14px;font-weight:700}</style></defs>
  <rect width="1400" height="900" class="cream"/><rect width="1400" height="900" fill="url(#dots)"/><rect width="1400" height="900" filter="url(#grain)"/><rect x="30" y="30" width="1340" height="840" fill="none" class="line"/><rect x="30" y="30" width="22" height="840" class="yellow"/>
  <text x="82" y="82" class="ink small">CEYUAN2 / REFERENCE MAP / 04</text><text x="82" y="164" class="ink big">34 个模块，不是让你全读</text><rect x="82" y="184" width="650" height="16" class="yellow"/><text x="82" y="240" class="ink body">把它想成一箱工具：到哪一步，拿哪一把。当前任务之外的内容保持安静。</text>
  <g transform="translate(82 302)">
    <g><rect width="290" height="150" class="yellow line"/><text x="22" y="40" class="ink h">01 / 判局与证据</text><text x="22" y="80" class="ink small">triage-router</text><text x="22" y="108" class="ink small">search-paths</text><text x="22" y="136" class="ink small">anti-hallucination</text><rect x="320" width="290" height="150" fill="#fffdf5" class="line"/><text x="342" y="40" class="ink h">02 / 行为改变</text><text x="342" y="80" class="ink small">stakeholder-behavior</text><text x="342" y="108" class="ink small">dimensions / axes</text><text x="342" y="136" class="ink small">client-vendor</text><rect x="640" width="290" height="150" class="yellow line"/><text x="662" y="40" class="ink h">03 / 经营模型</text><text x="662" y="80" class="ink small">business-model</text><text x="662" y="108" class="ink small">metrics-flow</text><text x="662" y="136" class="ink small">data-capture / To B chain</text><rect x="960" width="290" height="150" class="ink"/><text x="982" y="40" fill="#ffd400" class="h">04 / 叙事主线</text><text x="982" y="80" fill="#f5f1e7" class="small">china-market-narrative</text><text x="982" y="108" fill="#f5f1e7" class="small">pitch-winning</text><text x="982" y="136" fill="#ffd400" class="small">culture-tourism</text></g>
    <g transform="translate(0 180)"><rect width="290" height="150" fill="#fffdf5" class="line"/><text x="22" y="40" class="ink h">05 / 创意机制</text><text x="22" y="80" class="ink small">creative-inputs</text><text x="22" y="108" class="ink small">anti-stale-creative</text><text x="22" y="136" class="ink small">new-media / experiment</text><rect x="320" width="290" height="150" class="yellow line"/><text x="342" y="40" class="ink h">06 / 交付系统</text><text x="342" y="80" class="ink small">critical-path</text><text x="342" y="108" class="ink small">registration / sponsorship</text><text x="342" y="136" class="ink small">session / scope boundary</text><rect x="640" width="290" height="150" class="red line"/><text x="662" y="40" fill="#f5f1e7" class="h">07 / 对抗审查</text><text x="662" y="80" fill="#f5f1e7" class="small">adversarial</text><text x="662" y="108" fill="#f5f1e7" class="small">aesthetic-identity-risk</text><text x="662" y="136" fill="#f5f1e7" class="small">风险必须给修法</text><rect x="960" width="290" height="150" fill="#fffdf5" class="line"/><text x="982" y="40" class="ink h">08 / 成案与终审</text><text x="982" y="80" class="ink small">proposal-schema</text><text x="982" y="108" class="ink small">boardroom-proposal</text><text x="982" y="136" class="ink small">pitch-battle / role prompts</text></g>
    <rect y="390" width="610" height="82" class="ink"/><text x="24" y="424" fill="#ffd400" class="ink h" style="fill:#ffd400">场景快捷通道</text><text x="24" y="453" fill="#f5f1e7" class="small">event-types / industries / market-track-cards</text><rect x="640" y="390" width="610" height="82" class="yellow line"/><text x="664" y="424" class="ink h">写入边界</text><text x="664" y="453" class="ink small">复盘进 case-library，不直接改 reference 方法论</text>
  </g>
  <rect x="82" y="808" width="1220" height="28" class="red"/><text x="98" y="829" fill="#f5f1e7" class="small">规则：模块按 Step 触发；未到 Step 8，不输出完整预算、排期或上交版方案。</text>
</svg>
