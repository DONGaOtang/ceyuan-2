      <path d="M629 743 C760 615 920 546 1119 535"/>
      <path d="M629 811 C760 628 913 549 1119 535"/>
      <path d="M1119 535 L1558 535"/>
    </g>
    <g fill="#111">
      <circle cx="1370" cy="480" r="17"/>
