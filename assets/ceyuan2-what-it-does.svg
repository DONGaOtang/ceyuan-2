<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
  <title id="title">策元2在干什么</title>
  <desc id="desc">用粗颗粒、强标题、黄黑视觉说明策元2如何把模糊活动需求变成可判断、可验证、可执行、可上交的方案。</desc>
  <defs>
    <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".72" numOctaves="3" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="table" tableValues="0 .16"/></feComponentTransfer></filter>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse"><path d="M44 0H0v44" fill="none" stroke="#111827" stroke-opacity=".08" stroke-width="1"/></pattern>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="4" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,8 L11,4 z" fill="#111827"/></marker>
    <style>
      .bg{fill:#e8ece8}.ink{fill:#111827;font-family:Arial,"Microsoft YaHei",sans-serif}.muted{fill:#374151;font-family:Arial,"Microsoft YaHei",sans-serif}
      .yellow{fill:#ffe600}.black{fill:#111827}.white{fill:#fffdf0}.red{fill:#ff385c}
      .stroke{stroke:#111827;stroke-width:4}.heavy{stroke:#111827;stroke-width:7}.big{font-size:62px;font-weight:900;letter-spacing:0}.h2{font-size:34px;font-weight:900}.h3{font-size:24px;font-weight:900}.body{font-size:19px}.small{font-size:15px}.tag{font-size:17px;font-weight:800}
    </style>
  </defs>
  <rect width="1400" height="820" class="bg"/>
  <rect width="1400" height="820" fill="url(#grid)"/>
  <rect width="1400" height="820" filter="url(#grain)"/>
  <rect x="28" y="28" width="1344" height="764" fill="none" class="heavy"/>

  <text x="58" y="88" class="ink small" font-weight="900">README VISUAL SYSTEM / CEYUAN2</text>
  <text x="58" y="158" class="ink big">策元2到底在干嘛？</text>
  <rect x="58" y="178" width="680" height="18" class="yellow"/>
  <text x="58" y="232" class="muted body">不是“帮你写一个活动流程”，而是把模糊活动需求拆成一套能判断、能验证、能执行、能上交的方案系统。</text>

  <g transform="translate(58 284)">
    <rect x="0" y="0" width="560" height="210" rx="20" class="white stroke"/>
    <rect x="24" y="24" width="210" height="36" rx="18" class="black"/>
    <text x="44" y="49" fill="#ffe600" class="tag" font-family="Arial,'Microsoft YaHei',sans-serif">普通 AI 的坏答案</text>
    <text x="28" y="98" class="ink h3">发布会方案</text>
    <rect x="28" y="120" width="468" height="52" rx="12" fill="#111827"/>
    <text x="48" y="154" fill="#ffe600" class="body" font-family="Arial,'Microsoft YaHei',sans-serif">签到 → 致辞 → 介绍 → 抽奖 → 合影</text>
    <text x="28" y="195" class="red h3">看起来完整，但核心问题没判断</text>
  </g>

  <path d="M646 388H750" fill="none" stroke="#111827" stroke-width="7" marker-end="url(#arrow)"/>

  <g transform="translate(780 284)">
    <rect x="0" y="0" width="562" height="210" rx="20" class="yellow stroke"/>
    <text x="30" y="57" class="ink h2">策元2先做判断</text>
    <text x="32" y="100" class="ink body">这场活动到底要赢什么？</text>
    <text x="32" y="134" class="ink body">谁付钱、谁拍板、谁到场、谁会反对？</text>
    <text x="32" y="168" class="ink body">成功怎么证明？创意如何落地？</text>
    <rect x="360" y="126" width="152" height="44" rx="22" class="black"/>
    <text x="386" y="155" fill="#ffe600" class="tag" font-family="Arial,'Microsoft YaHei',sans-serif">先判局</text>
  </g>

  <g transform="translate(58 548)">
    <text x="0" y="0" class="ink h2">核心链路</text>
    <g transform="translate(0 34)">
      <rect x="0" y="0" width="142" height="88" rx="16" class="yellow stroke"/><text x="33" y="38" class="ink h3">判局</text><text x="26" y="66" class="muted small">路线先定</text>
      <rect x="164" y="0" width="142" height="88" rx="16" class="white stroke"/><text x="197" y="38" class="ink h3">取证</text><text x="190" y="66" class="muted small">别编事实</text>
      <rect x="328" y="0" width="142" height="88" rx="16" class="yellow stroke"/><text x="361" y="38" class="ink h3">行为</text><text x="348" y="66" class="muted small">谁改变什么</text>
      <rect x="492" y="0" width="142" height="88" rx="16" class="white stroke"/><text x="525" y="38" class="ink h3">经营</text><text x="522" y="66" class="muted small">钱与指标</text>
      <rect x="656" y="0" width="142" height="88" rx="16" class="yellow stroke"/><text x="689" y="38" class="ink h3">叙事</text><text x="678" y="66" class="muted small">能被复述</text>
      <rect x="820" y="0" width="142" height="88" rx="16" class="white stroke"/><text x="853" y="38" class="ink h3">创意</text><text x="840" y="66" class="muted small">机制非换皮</text>
      <rect x="984" y="0" width="142" height="88" rx="16" class="yellow stroke"/><text x="1017" y="38" class="ink h3">交付</text><text x="1008" y="66" class="muted small">谁何时做</text>
      <rect x="1148" y="0" width="142" height="88" rx="16" class="black"/><text x="1181" y="38" fill="#ffe600" class="h3" font-family="Arial,'Microsoft YaHei',sans-serif">对抗</text><text x="1171" y="66" fill="#fffdf0" class="small" font-family="Arial,'Microsoft YaHei',sans-serif">先打再修</text>
    </g>
  </g>
  <text x="58" y="746" class="ink h3">一句话：从“我想办个活动”走到“这份方案为什么成立、怎么交付、失败怎么办”。</text>
</svg>
