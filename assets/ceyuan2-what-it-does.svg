<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
  <title id="title">策元2到底在干嘛</title>
  <desc id="desc">策元2把模糊活动需求转化为经过判局、取证、行为设计、经营建模、交付和对抗审查的可执行方案。</desc>
  <defs>
    <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency=".72" numOctaves="3"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="table" tableValues="0 .11"/></feComponentTransfer></filter>
    <pattern id="dots" width="14" height="14" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#101010" opacity=".16"/></pattern>
    <style>
      .ink{fill:#101010;font-family:Arial,"Microsoft YaHei",sans-serif}.cream{fill:#f5f1e7}.yellow{fill:#ffd400}.red{fill:#ef3d2f}.line{stroke:#101010;stroke-width:5}.big{font-size:78px;font-weight:900}.num{font-size:100px;font-weight:900}.h{font-size:28px;font-weight:900}.body{font-size:19px}.small{font-size:15px;font-weight:700}
    </style>
  </defs>
  <rect width="1400" height="820" class="cream"/><rect width="1400" height="820" fill="url(#dots)"/><rect width="1400" height="820" filter="url(#grain)"/>
  <rect x="30" y="30" width="1340" height="760" fill="none" class="line"/><rect x="30" y="30" width="22" height="760" class="yellow"/>
  <text x="82" y="82" class="ink small">CEYUAN2 / PROJECT PRIMER / 01</text>
  <text x="82" y="178" class="ink big">策元2到底在干嘛？</text><rect x="82" y="198" width="530" height="17" class="yellow"/>
  <text x="82" y="256" class="ink body">不是把活动流程写得更长。</text><text x="82" y="288" class="ink body">是先判断这场局，再决定什么值得被写进方案。</text>
  <g transform="translate(82 352)"><rect x="0" y="0" width="470" height="230" fill="#dedbd2" class="line"/>
    <text x="24" y="54" class="ink num">01</text><text x="160" y="47" class="ink h">普通 AI</text><text x="160" y="80" class="ink small">直接套模板</text><line x1="24" y1="105" x2="446" y2="105" class="line"/>
    <text x="24" y="143" class="ink body">签到 → 致辞 → 介绍</text><text x="24" y="177" class="ink body">→ 抽奖 → 合影</text><rect x="24" y="194" width="422" height="27" class="red"/><text x="38" y="214" fill="#f5f1e7" class="small">看起来完整，实际上没有判断</text>
  </g>
  <g transform="translate(608 352)"><rect x="0" y="0" width="710" height="230" class="yellow line"/>
    <text x="28" y="56" class="ink num">02</text><text x="184" y="47" class="ink h">策元2</text><text x="184" y="80" class="ink small">先判局，再成案</text><line x1="28" y1="105" x2="682" y2="105" class="line"/>
    <text x="28" y="143" class="ink body">这场活动要赢什么？谁付钱？谁拍板？</text><text x="28" y="177" class="ink body">什么证据能证明成功？谁会反对？如何落地？</text><rect x="510" y="190" width="172" height="27" fill="#101010"/><text x="546" y="210" fill="#ffd400" class="small">先问对问题</text>
  </g>
  <g transform="translate(82 625)"><text x="0" y="31" class="ink h">它把一件模糊的事，拆成八个可检查动作</text><g transform="translate(0 58)">
    <rect x="0" y="0" width="144" height="54" class="ink"/><text x="36" y="35" fill="#ffd400" class="h">判局</text><rect x="152" y="0" width="144" height="54" fill="#fffdf5" class="line"/><text x="188" y="35" class="ink h">取证</text><rect x="304" y="0" width="144" height="54" class="yellow line"/><text x="340" y="35" class="ink h">行为</text><rect x="456" y="0" width="144" height="54" fill="#fffdf5" class="line"/><text x="492" y="35" class="ink h">经营</text><rect x="608" y="0" width="144" height="54" class="yellow line"/><text x="644" y="35" class="ink h">叙事</text><rect x="760" y="0" width="144" height="54" fill="#fffdf5" class="line"/><text x="796" y="35" class="ink h">创意</text><rect x="912" y="0" width="144" height="54" class="yellow line"/><text x="948" y="35" class="ink h">交付</text><rect x="1064" y="0" width="144" height="54" class="red line"/><text x="1098" y="35" fill="#f5f1e7" class="h">对抗</text>
  </g></g>
  <text x="82" y="758" class="ink small">OUTPUT: 一份为什么成立、怎么交付、失败怎么办的方案。</text>
</svg>
